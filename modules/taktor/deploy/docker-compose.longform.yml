services:
  acestep:
    image: ghcr.io/ace-step/ace-step-1.5:0.1.8
    restart: unless-stopped
    command: ["uv", "run", "acestep-api"]
    env_file: .env
    environment:
      ACESTEP_API_HOST: ${ACESTEP_API_HOST:-0.0.0.0}
      ACESTEP_API_PORT: ${ACESTEP_API_PORT:-8001}
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:?ACESTEP_API_KEY required}
      ACESTEP_API_WORKERS: ${ACESTEP_API_WORKERS:-1}
      ACESTEP_CONFIG_PATH: ${ACESTEP_CONFIG_PATH:-acestep-v15-turbo}
      ACESTEP_OFFLOAD_TO_CPU: ${ACESTEP_OFFLOAD_TO_CPU:-true}
    volumes:
      - acestep_checkpoints:/app/checkpoints
      - acestep_cache:/root/.cache
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  taktor-pilot:
    build:
      context: ../orchestrator
    profiles: ["pilot"]
    restart: "no"
    env_file: .env
    environment:
      ACESTEP_BASE_URL: http://acestep:8001
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:?ACESTEP_API_KEY required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DIRECTOR_MODEL: ${OPENAI_DIRECTOR_MODEL:-}
      OPENAI_WORKER_MODEL: ${OPENAI_WORKER_MODEL:-}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-}
      TAKTOR_STORAGE_ROOT: /data
      TAKTOR_RENDER_TIMEOUT_SECONDS: ${TAKTOR_RENDER_TIMEOUT_SECONDS:-14400}
    volumes:
      - ../../..:/repo:ro
      - ${TAKTOR_HOST_STORAGE:-./data}:/data
    depends_on:
      acestep:
        condition: service_healthy
    command:
      - --job
      - /repo/modules/taktor/pilots/offener-kreis-01/pilot-job.json
      - --story
      - /repo/modules/taktor/pilots/offener-kreis-01/story-dna.json
      - --storage-root
      - /data

volumes:
  acestep_checkpoints:
  acestep_cache:
